apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp-deployment
  labels:
    app: scaletestapp-pod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp-pod
  template:
    metadata:
      labels:
        app: scaletestapp-pod
    spec:
      containers:
      - name: scaletestapp-pod
        image: shestera/scaletestapp:latest
        ports:
        - containerPort: 8080
        resources:
         limits:
           memory: "30Mi"
